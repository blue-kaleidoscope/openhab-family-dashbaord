  # ---------------------------------------------------------------------
  # Uhr fuer das Dashboard: aendert sich jede Minute und stoesst damit die
  # Neuberechnung der zeitabhaengigen Widget-Ausdruecke an (NTP-Binding).
  # ---------------------------------------------------------------------
  ntp:ntp:dashboard:
    label: Dashboard-Uhr
    config:
      hostname: 0.pool.ntp.org
      refreshInterval: 60      # Sekunden: Item-Update jede Minute
      refreshNtp: 30           # Minuten: Abgleich mit dem NTP-Server
      timeZone: Europe/Berlin

