version: 1

# =====================================================================
# Familien-Dashboard - Kalenderdaten (Backend)
# Ablage: $OPENHAB_CONF/yaml/familien-dashboard-kalender.yaml
#
# Die Kalender-Bridges (icalendar:calendar:Kalender_<Name>) existieren bereits.
# Hier kommen je Kalender Eventfilter als Kinder der Bridge dazu:
#   Heute : jetzt bis +24 h, 6 Slots  -> Items Termine_<Name>_<n>_Titel/Beginn/Ende
#   Woche : heute 00:00 bis +7 Tage, 30 Slots -> Items Woche_<Name>_<n>_Titel/Beginn/Ende
#
# Kalender:
#   Lisa      Bridge Kalender_Lisa      Heute + Woche
#   Max       Bridge Kalender_Max       Heute + Woche
#   Max/Arbeit Bridge Kalender_MaxArbeit Heute + Woche (im Dashboard mit Max zusammengefasst)
#   Familie   Bridge Kalender_Familie   Heute + Woche
#   Tom  Bridge Kalender_Tom  Heute + Woche
#   Paul    Bridge Kalender_Paul    Heute + Woche
# =====================================================================

things:

  # ------------------------------- Lisa -------------------------------
  icalendar:eventfilter:Kalender_Lisa:Heute:
    bridge: icalendar:calendar:Kalender_Lisa
    label: Termine heute (Lisa)
    config:
      maxEvents: 6             # Anzahl Slots -> muss zu den Items passen
      refreshTime: 5           # Minuten; Fenster wird bei jedem Refresh neu berechnet
      datetimeUnit: HOUR
      datetimeStart: 0         # Fenster beginnt JETZT ...
      datetimeEnd: 24          # ... und reicht 24 h voraus
      datetimeRound: false     # NICHT runden, sonst bleibt der Fensterbeginn bei 00:00
      datetimeMode: ACTIVE     # laufende + kommende Termine, beendete fallen raus

  icalendar:eventfilter:Kalender_Lisa:Woche:
    bridge: icalendar:calendar:Kalender_Lisa
    label: Termine diese Woche (Lisa)
    config:
      maxEvents: 30            # Anzahl Slots -> muss zu den Woche-Items passen
      refreshTime: 5
      datetimeUnit: DAY        # mit datetimeRound: ab heute 00:00 ...
      datetimeStart: 0
      datetimeEnd: 7           # ... bis in 7 Tagen 00:00 (heute + 6 Tage)
      datetimeRound: true
      datetimeMode: ACTIVE     # auch Termine, die vor heute begonnen haben und noch laufen

  # ------------------------------- Max -------------------------------
  icalendar:eventfilter:Kalender_Max:Heute:
    bridge: icalendar:calendar:Kalender_Max
    label: Termine heute (Max)
